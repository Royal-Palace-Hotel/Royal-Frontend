<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Royal Palace Antsirabe — Hôtel 5 Étoiles de Luxe | Madagascar</title>
    <meta name="description" content="Royal Palace Antsirabe, une adresse de charme et de raffinement au cœur du Vakinankaratra, Madagascar. Chambres & suites de luxe, restaurant gastronomique, spa, piscine et événements d'exception." />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!--
      Aperçu lors d'un partage (WhatsApp, Facebook, Messenger).
      `og:image` doit être une URL absolue : les robots des réseaux ne résolvent
      pas les chemins relatifs. Sans elle, le lien de l'hôtel se partage sans la
      moindre image.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Royal Palace Antsirabe" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Royal Palace Antsirabe — Hôtel 5 Étoiles de Luxe" />
    <meta property="og:description" content="Une adresse de charme au cœur d'Antsirabe, Madagascar. Chambres & suites, restaurant, spa et piscine." />
    <meta property="og:image" content="%VITE_SITE_URL%/images/hero/hero-building.jpg" />
    <meta property="og:image:width" content="1382" />
    <meta property="og:image:height" content="745" />
    <meta property="og:image:alt" content="Façade du Royal Palace Antsirabe au crépuscule" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#C9A961" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      L'image du hero est le plus gros élément du premier affichage. La
      précharger ici la met en file d'attente avant même que React ne démarre.
    -->
    <link rel="preload" as="image" href="/images/hero/hero-building.jpg" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!--
      Données structurées : c'est ce qui permet à Google d'afficher l'hôtel avec
      ses coordonnées, sa catégorie et son secteur directement dans les
      résultats, plutôt qu'un simple lien bleu.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Hotel",
        "name": "Royal Palace Antsirabe",
        "url": "%VITE_SITE_URL%/",
        "image": "%VITE_SITE_URL%/images/hero/hero-building.jpg",
        "description": "Hôtel de luxe au cœur d'Antsirabe, Madagascar : chambres et suites, restaurant gastronomique, spa, piscine et salles d'événements.",
        "telephone": "+261344904040",
        "email": "royalpalace.resa@moov.mg",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "RN7, Lot 512 C 61 Tsarasaotra, Route d'Ambositra",
          "addressLocality": "Antsirabe",
          "postalCode": "110",
          "addressCountry": "MG"
        },
        "amenityFeature": [
          { "@type": "LocationFeatureSpecification", "name": "Restaurant", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Spa", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Piscine", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Wi-Fi gratuit", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Salles de réunion", "value": true }
        ]
      }
    </script>
  </head>
  <body class="bg-white text-charcoal font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
